<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f4f1ea">
<title>❤️</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f4f1ea;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
    }

    /* 全屏爱心舞台 */
    .stage {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f4f1ea;
    }

    /* 气泡 */
    .bubble {
        position: absolute;
        left: 50%;
        top: 50%;
        white-space: nowrap;
        font-size: 12px;
        line-height: 1.4;
        padding: 6px 11px;
        border-radius: 14px;
        color: #6b4a3a;
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.3);
        transition: opacity 0.6s ease, transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
        box-shadow: 0 2px 6px rgba(180,140,120,0.12);
        border: 1px solid rgba(255,255,255,0.55);
        font-weight: 500;
        pointer-events: none;
        will-change: transform, opacity;
    }
    .bubble.show {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }

    /* 底部祝福语 */
    .blessing {
        position: absolute;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 32px);
        left: 0;
        right: 0;
        text-align: center;
        z-index: 10;
        opacity: 0;
        transition: opacity 1.4s ease;
        pointer-events: none;
    }
    .blessing.show { opacity: 1; }
    .blessing .b1 {
        font-size: 14px;
        color: #b0705a;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-shadow: 0 1px 2px rgba(200,120,100,0.15);
    }
    .blessing .b2 {
        margin-top: 6px;
        font-size: 11px;
        color: #c4a08a;
        letter-spacing: 0.16em;
        font-weight: 400;
    }

    /* 轻触涟漪 */
    .ripple {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255,160,150,0.4) 0%, transparent 70%);
        pointer-events: none;
        animation: rippleAnim 0.9s ease-out forwards;
        z-index: 9;
    }
    @keyframes rippleAnim {
        0% { transform: translate(-50%,-50%) scale(0); opacity: 0.8; }
        100% { transform: translate(-50%,-50%) scale(4); opacity: 0; }
    }

    .replay-hint {
        position: absolute;
        top: 16px;
        right: 16px;
        z-index: 15;
        font-size: 11px;
        color: #c9a89a;
        background: rgba(255,255,255,0.7);
        padding: 5px 11px;
        border-radius: 20px;
        opacity: 0;
        transition: opacity 0.5s ease;
        pointer-events: auto;
        backdrop-filter: blur(4px);
    }
    .replay-hint.show { opacity: 1; }
</style>
</head>
<body>
<div class="stage" id="stage">
    <div class="replay-hint" id="replayHint">轻触重播</div>
    <div class="blessing" id="blessing">
        <div class="b1">代码只有几十行，对你的思念却远远不止</div>
        <div class="b2">— 每一句都是想你 —</div>
    </div>
</div>

<script>
(function(){
    "use strict";
    var stage = document.getElementById("stage");
    var blessing = document.getElementById("blessing");
    var replayHint = document.getElementById("replayHint");

    // 关怀文案
    var messages = [
        "我们都在你身边",
        "略略略加油哦",
        "你一定要开心",
        "以后会好起来的",
        "我们会买车子买房子的",
        "多吃水果",
        "下次见你就变得更加大美女了",
        "我会想你的",
        "我们俩要好好的",
        "略略略少熬夜",
        "略略略要记得多动噢",
        "略略略少生王一涵的气呗",
        "多喝水！！！",
        "你是最棒的",
        "想你了噢",
        "谢谢略略略大老板一直在请我吃东西",
        "以后赚钱了给你买想要的",
        "我们会有机会见面的",
        "照顾好自己哦",
        "不要和烂人一般见识",
        "记得好好吃饭",
        "不要害怕未来",
        "拿一个大大的offer",
        "略略略赚钱养我哦嘻嘻嘻",
        "略略略好想你",
        "王一涵在绍兴和永兴很想你",
        "略略略是小笨蛋",
        "略略略坐车不晕车",
        "略略略一路顺风",
        "保持好心情",
        "我们都会如愿以偿",
        "梦想成真",
        "顺顺利利",
        "抱抱你",
        "累了就休息一下下",
        "等待不被辜负",
        "你真的挺坚强的",
        "吃好吃的有幸福感",
        "不开心记得和我说"
    ];

    // 暖色气泡背景
    var colors = [
        "#fff3d6", "#ffe8d1", "#ffd9c9", "#ffd0d8",
        "#ffe9c2", "#fde2d4", "#ffd6e0", "#fff0db",
        "#ffe2c4", "#ffdcdc", "#fff5e0", "#ffd2d8",
        "#ffe6cc", "#ffddee", "#fff8e8", "#ffd4c0"
    ];

    // 心形参数方程（y正向上，心尖朝下）
    function heartParam(t){
        var x = 16 * Math.pow(Math.sin(t), 3);
        var y = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
        return { x: x, y: y };
    }

    var bubbles = [];
    var W = 0, H = 0, scale = 1, cx = 0, cy = 0;

    // 预采样心形轮廓（等弧长）
    var arcSamples = [], arcTotal = 0;
    (function initArc(){
        var N = 800, prev = heartParam(0), cum = 0;
        arcSamples.push({ x: prev.x, y: prev.y, s: 0 });
        for (var i = 1; i <= N; i++){
            var t = (i / N) * Math.PI * 2;
            var p = heartParam(t);
            var d = Math.sqrt((p.x-prev.x)*(p.x-prev.x) + (p.y-prev.y)*(p.y-prev.y));
            cum += d;
            arcSamples.push({ x: p.x, y: p.y, s: cum });
            prev = p;
        }
        arcTotal = cum;
    })();

    function pointAtArc(s){
        s = ((s % arcTotal) + arcTotal) % arcTotal;
        var lo = 0, hi = arcSamples.length - 1;
        while (lo < hi){ var mid = (lo+hi)>>1; if (arcSamples[mid].s < s) lo = mid+1; else hi = mid; }
        return arcSamples[Math.max(0, lo-1)];
    }

    // 随机心形内点
    function randomHeartPoint(){
        // 70% 轮廓附近，30% 内部随机
        if (Math.random() < 0.7){
            var s = Math.random() * arcTotal;
            var p = pointAtArc(s);
            return { x: p.x + (Math.random()-0.5)*0.2, y: p.y + (Math.random()-0.5)*0.2 };
        } else {
            var t = Math.random() * Math.PI * 2;
            var p = heartParam(t);
            var r = 0.15 + Math.random() * 0.65;
            return { x: p.x * r + (Math.random()-0.5)*0.4, y: p.y * r + (Math.random()-0.5)*0.4 };
        }
    }

    function layout(){
        W = stage.clientWidth;
        H = stage.clientHeight;
        // 心形宽约32、高约22，映射到屏幕
        // 加上 yMid 偏移让爱心垂直居中，尺寸适配窄屏手机（375px宽）
        scale = Math.min(W * 0.027, H * 0.032, 13);
        cx = W / 2;
        cy = H * 0.48;
        // 重新定位已有气泡
        for (var i = 0; i < bubbles.length; i++){
            var b = bubbles[i];
            if (!b) continue;
            b.el.style.left = (cx + b.pt.x * scale) + "px";
            b.el.style.top = (cy - (b.pt.y - (-6)) * scale) + "px";
        }
    }

    // 持续生成系统
    var MAX_BUBBLES = 130;
    var spawnTimer = null;
    var spawnCount = 0;
    var blessingShown = false;
    var phase = 0; // 0=轮廓铺设, 1=持续叠加
    var outlineQueue = [];
    var INIT_SPEED = 180; // 轮廓阶段慢一些，让爱心清晰可见
    var FILL_SPEED = 100; // 填充阶段快一些

    function spawnOne(){
        var pt, msgIdx, colorIdx;
        if (phase === 0 && outlineQueue.length > 0){
            pt = outlineQueue.shift();
            msgIdx = Math.floor(Math.random() * messages.length);
            colorIdx = Math.floor(Math.random() * colors.length);
        } else {
            if (phase === 0) {
                phase = 1;
                // 切换到填充阶段，加速生成
                clearInterval(spawnTimer);
                spawnTimer = setInterval(spawnOne, FILL_SPEED);
            }
            pt = randomHeartPoint();
            msgIdx = Math.floor(Math.random() * messages.length);
            colorIdx = Math.floor(Math.random() * colors.length);
        }

        var msg = messages[msgIdx];
        var color = colors[colorIdx];

        var el = document.createElement("div");
        el.className = "bubble";
        el.textContent = msg;
        var len = msg.length;
        if (len > 12){
            el.style.fontSize = "10px";
            el.style.maxWidth = "120px";
            el.style.whiteSpace = "normal";
            el.style.textAlign = "center";
        } else {
            el.style.fontSize = (12 + Math.floor(Math.random()*3)) + "px";
        }
        el.style.backgroundColor = color;
        el.style.left = (cx + pt.x * scale) + "px";
        el.style.top = (cy - (pt.y - (-6)) * scale) + "px";
        el.style.zIndex = String(10 + spawnCount);
        stage.appendChild(el);
        requestAnimationFrame(function(){
            el.classList.add("show");
        });

        bubbles.push({ el: el, pt: pt, zIndex: 10 + spawnCount });
        spawnCount++;

        // 达到上限：移除被遮住的气泡
        if (bubbles.length > MAX_BUBBLES){
            removeCoveredBubble();
        }

        // 轮廓铺完后显示祝福语
        if (!blessingShown && phase === 1 && spawnCount > 30){
            blessingShown = true;
            blessing.classList.add("show");
            replayHint.classList.add("show");
        }
    }

    // 只移除被覆盖的旧气泡
    function removeCoveredBubble(){
        for (var i = 0; i < bubbles.length; i++){
            var b = bubbles[i];
            if (b.removing) continue;
            var coverCount = 0;
            var bx = b.pt.x, by = b.pt.y;
            for (var j = bubbles.length - 1; j > i; j--){
                var ob = bubbles[j];
                if (ob.removing) continue;
                var dx = ob.pt.x - bx;
                var dy = ob.pt.y - by;
                if (dx*dx + dy*dy < 9){
                    coverCount++;
                    if (coverCount >= 3) break;
                }
            }
            if (coverCount >= 3){
                b.removing = true;
                b.el.style.transition = "opacity 1.8s ease, transform 1.8s ease";
                b.el.style.opacity = "0";
                b.el.style.transform = "translate(-50%,-50%) scale(0.7)";
                (function(node, ref){
                    setTimeout(function(){
                        if (node.parentNode) node.parentNode.removeChild(node);
                        var idx = bubbles.indexOf(ref);
                        if (idx >= 0) bubbles.splice(idx, 1);
                    }, 1850);
                })(b.el, b);
                return;
            }
        }
    }

    function startSpawn(){
        stopSpawn();
        // 清空旧气泡
        for (var i = 0; i < bubbles.length; i++){
            if (bubbles[i].el.parentNode) bubbles[i].el.parentNode.removeChild(bubbles[i].el);
        }
        bubbles = [];
        spawnCount = 0;
        blessingShown = false;
        phase = 0;
        blessing.classList.remove("show");
        replayHint.classList.remove("show");
        // 准备轮廓点：沿心形等弧长取 60 个点（更密集，爱心更清晰）
        outlineQueue = [];
        var nOutline = 60;
        for (var i = 0; i < nOutline; i++){
            var s = (i / nOutline) * arcTotal;
            var p = pointAtArc(s);
            outlineQueue.push({
                x: p.x + (Math.random()-0.5)*0.2,
                y: p.y + (Math.random()-0.5)*0.2
            });
        }
        // 轮廓阶段慢速生成，让爱心轮廓清晰可见
        spawnTimer = setInterval(spawnOne, INIT_SPEED);
    }

    function stopSpawn(){
        if (spawnTimer){ clearInterval(spawnTimer); spawnTimer = null; }
    }

    // 轻触涟漪 + 重播
    var canReplay = false;
    function replay(){
        stopSpawn();
        for (var i = 0; i < bubbles.length; i++){
            if (bubbles[i].el.parentNode) bubbles[i].el.parentNode.removeChild(bubbles[i].el);
        }
        bubbles = [];
        spawnCount = 0;
        startSpawn();
    }
    stage.addEventListener("click", function(e){
        // 涟漪
        var r = document.createElement("div");
        r.className = "ripple";
        r.style.left = e.clientX + "px";
        r.style.top = e.clientY + "px";
        var size = 30 + Math.random() * 40;
        r.style.width = size + "px";
        r.style.height = size + "px";
        stage.appendChild(r);
        setTimeout(function(){ if (r.parentNode) r.parentNode.removeChild(r); }, 900);
        // 重播
        if (canReplay){
            replay();
        }
    });

    // 窗口变化
    window.addEventListener("resize", layout);

    // 启动
    layout();
    startSpawn();
    // 3 秒后允许重播
    setTimeout(function(){ canReplay = true; }, 3000);
})();
</script>
</body>
</html>
